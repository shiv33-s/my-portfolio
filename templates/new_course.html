{% extends "base.html" %}{% block title %}Create course | Capacity Connect{% endblock %}
{% block content %}<a class="back-link" href="{{ url_for('dashboard') }}">← Back to dashboard</a><section class="form-card wide-form"><div class="eyebrow">TRAINER WORKSPACE</div><h1>Create a learning course</h1><p class="muted">Add a course to the Capacity Connect catalogue.</p><form method="post"><label>Course title</label><input name="title" required placeholder="e.g. Fundamentals of Data Literacy"><label>Description</label><textarea name="description" required rows="4" placeholder="What will trainees learn?"></textarea><div class="form-two"><div><label>Category</label><input name="category" required placeholder="e.g. Digital Skills"></div><div><label>Level</label><select name="level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div></div><label>Competencies / skills <span class="muted">(comma-separated)</span></label><input name="skills" required placeholder="e.g. data analysis, communication"><label>Duration</label><input name="duration" value="2 hours" placeholder="e.g. 3 hours"><button class="btn primary" type="submit">Publish course →</button></form></section>{% endblock %}
